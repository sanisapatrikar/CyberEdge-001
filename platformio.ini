; CyberEdge-001 firmware
; Board is a placeholder — swap for your exact ESP32-S3 module's board id
; once you have the datasheet part number (e.g. esp32-s3-devkitc-1).

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs   ; required for the audit log (safety/audit_log.cpp)
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DENABLE_BADUSB=0          ; BadUSB module disabled for V1 — see modules/module_registry.cpp
lib_deps =
    ; add display / RFID / nRF libraries here once part numbers are confirmed
    ; e.g. MFRC522 for RFID, LVGL or TFT_eSPI for the display, RF24 for nRF24-family modules
